version: 1
settings:
  stateDirectory: /data/state
pipelines:
  gallery:
    watch: /data/input
    processing: /data/processing
    output: /data/output
    archive: /data/archive
    failed: /data/failed
    steps:
      - type: normalize
      - type: resize
        width: 1920
        height: 1920
        fit: inside
      - type: export
        variants:
          - format: webp
            name: lightbox
            quality: 90
          - format: webp
            name: gallery-960
            resize:
              width: 960
              height: 960
          - format: webp
            name: thumbnail-400
            resize:
              width: 400
              height: 400
